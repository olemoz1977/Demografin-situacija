name: Probe Aruodas district scope

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "scripts/probe_aruodas_district_scope.mjs"
      - ".github/workflows/aruodas-district-scope-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aruodas-district-scope-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe backend scope
        run: |
          rm -rf research/raw/aruodas-district-scope-probe
          node scripts/probe_aruodas_district_scope.mjs
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/raw/aruodas-district-scope-probe
          if git diff --cached --quiet; then
            echo "No probe changes"
          else
            git commit -m "Capture Aruodas district scope probe [skip ci]"
            git fetch origin feature/housing-affordability
            git rebase origin/feature/housing-affordability
            git push origin HEAD:feature/housing-affordability
          fi