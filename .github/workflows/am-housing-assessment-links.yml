name: Extract AM housing assessment links

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - ".github/workflows/am-housing-assessment-links.yml"
      - "scripts/extract_am_housing_assessment_links.mjs"

permissions:
  contents: write

concurrency:
  group: am-housing-assessment-links-feature
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Extract links
        run: node scripts/extract_am_housing_assessment_links.mjs
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/raw/am-housing-assessment-links/links.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Capture AM housing assessment attachment links [skip ci]"
            git fetch origin feature/housing-affordability
            git rebase origin/feature/housing-affordability
            git push origin HEAD:feature/housing-affordability
          fi
