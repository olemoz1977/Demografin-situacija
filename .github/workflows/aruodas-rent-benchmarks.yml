name: Extract Aruodas rent benchmarks

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "scripts/extract_aruodas_rent_benchmarks.mjs"
      - ".github/workflows/aruodas-rent-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aruodas-rent-benchmarks-feature
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Extract 2025 Aruodas rent benchmarks
        run: |
          rm -rf research/raw/aruodas-rent-benchmark
          node scripts/extract_aruodas_rent_benchmarks.mjs

      - name: Commit benchmark diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/raw/aruodas-rent-benchmark
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit"
          else
            git commit -m "Capture Aruodas 2025 rent benchmarks [skip ci]"
            git fetch origin feature/housing-affordability
            git rebase origin/feature/housing-affordability
            git push origin HEAD:feature/housing-affordability
          fi
