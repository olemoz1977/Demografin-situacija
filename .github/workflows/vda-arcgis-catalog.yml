name: Discover VDA ArcGIS catalog

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "scripts/discover_vda_arcgis_catalog.mjs"
      - ".github/workflows/vda-arcgis-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vda-arcgis-catalog-feature
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover ArcGIS catalog
        run: |
          rm -rf research/raw/vda-arcgis-catalog
          node scripts/discover_vda_arcgis_catalog.mjs
      - name: Commit discovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/raw/vda-arcgis-catalog
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Capture VDA ArcGIS catalog discovery [skip ci]"
            git fetch origin feature/housing-affordability
            git rebase origin/feature/housing-affordability
            git push origin HEAD:feature/housing-affordability
          fi
