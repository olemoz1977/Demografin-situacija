name: Test preliminary housing view

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "app.js"
      - "research-nav.js"
      - "housing-affordability.js"
      - "data/housing-affordability-preliminary-v01.json"
      - "data/housing-state-support-income-screen-2025.json"
      - ".github/workflows/test-housing-preliminary-view.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check research-nav.js
          node --check housing-affordability.js
      - name: Validate v0.1 payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/housing-affordability-preliminary-v01.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          rows=d["rows"]
          assert len(rows)==10, len(rows)
          counties={r["county"] for r in rows}
          assert len(counties)==10, counties
          assert all(r["value_status"]=="PRELIMINARY_V0.1_TO_BE_REFINED" for r in rows)
          assert all(r.get("needs_refinement") is True for r in rows)
          assert all("preliminary_affordability_rank" not in r for r in rows)
          assert all(r["m2_after_rent_sensitivity_low"] <= r["m2_per_year_after_rent"] <= r["m2_after_rent_sensitivity_high"] for r in rows)
          assert all(r["standard_50m2_price_eur"] > 0 for r in rows)
          assert all(r["standard_50m2_price_to_pair_annual_net_years"] > 0 for r in rows)
          assert all(0 < r["rent_burden_pct_pair_net_income"] < 100 for r in rows)
          assert d.get("display_order")=="m2_per_year_after_rent_desc_for_visual_comparison_only"
          nav=Path("research-nav.js").read_text(encoding="utf-8")
          assert "housingAffordability:'housing'" in nav
          assert "label:'Būstas'" in nav
          index=Path("index.html").read_text(encoding="utf-8")
          assert 'app.js?v=20261002i' in index
          assert 'style.css?v=20261002h' in index
          app=Path("app.js").read_text(encoding="utf-8")
          assert "housing-affordability.js" in app
          support=json.loads(Path("data/housing-state-support-income-screen-2025.json").read_text(encoding="utf-8"))
          assert support["status"]=="MODELLED_SCREENING_ONLY_NOT_ELIGIBILITY_DETERMINATION"
          assert support["official_threshold"]["annual_net_income_limit_eur"]==32708
          srows={r["county"]:r for r in support["rows"]}
          assert srows["Vilniaus"]["model_pair_annual_net_eur"]==39856.8
          assert srows["Kauno"]["model_pair_annual_net_eur"]==35539.2
          assert srows["Klaipėdos"]["model_pair_annual_net_eur"]==33660.0
          assert srows["Vilniaus"]["screening_status"].startswith("ABOVE")
          assert srows["Kauno"]["screening_status"].startswith("ABOVE")
          assert srows["Klaipėdos"]["screening_status"].startswith("ABOVE")
          view=Path("housing-affordability.js").read_text(encoding="utf-8")
          assert "Ar jaunai dirbančiai porai prieinamas pirmas šeimos būstas?" in view
          assert "50 m² nėra tas pats būstas." in view
          assert "materialių šeimos kūrimo aplinkos barjerų" in view
          assert "neįrodinėja priežastinio ryšio su gimstamumu" in view
          assert "Vaikų turėjimas čia nėra atskira sąlyga" in view
          assert "Valstybės pagalba pirmajam būstui" in view
          assert "OFICIALIOS 2025 M. SĄLYGOS" in view
          assert "32 708 €" in view
          assert "57 902 €" in view
          assert "8 700 € / 10 875 € / 13 050 €" in view
          assert "13 050 € / 17 400 € / 21 750 € / 26 100 €" in view
          assert "Mūsų analitinė „25–30 m. dirbanti pora“ nėra tas pats" in view
          assert "2025 m. pajamų lubų patikra" in view
          assert "housingSupportIncomeChart" in view
          assert "2025 riba 32 708 €" in view
          assert "Tai nėra individualios teisės į paramą nustatymas" in view
          assert "2024 m. tokia pati dviejų asmenų šeimos pajamų riba buvo 26 048 €" in view
          assert "OFICIALIOS 2026 M. SĄLYGOS" not in view
          assert "34 484 €" not in view
          assert "nebelaikomi tinkamu tarpapskritiniu rezultatu" in view
          assert "45–55 m²" in view
          assert "statybos laikotarpio / rinkos segmento taisyklė" in view
          assert "housingAffordabilityChart" not in view
          assert "housingSimpleTable" not in view
          assert "m2_per_year_after_rent" not in view
          assert "standard_50m2_price_to_pair_annual_net_years" not in view
          print("PASS: public housing view blocks non-comparable county results")
          PY
