name: Test preliminary housing view

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "app.js"
      - "research-nav.js"
      - "housing-affordability.js"
      - "data/housing-affordability-preliminary-v01.json"
      - ".github/workflows/test-housing-preliminary-view.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check research-nav.js
          node --check housing-affordability.js
      - name: Validate v0.1 payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/housing-affordability-preliminary-v01.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          rows=d["rows"]
          assert len(rows)==10, len(rows)
          counties={r["county"] for r in rows}
          assert len(counties)==10, counties
          assert all(r["value_status"]=="PRELIMINARY_V0.1_TO_BE_REFINED" for r in rows)
          assert all(r.get("needs_refinement") is True for r in rows)
          assert all("preliminary_affordability_rank" not in r for r in rows)
          assert all(r["m2_after_rent_sensitivity_low"] <= r["m2_per_year_after_rent"] <= r["m2_after_rent_sensitivity_high"] for r in rows)
          assert all(r["standard_50m2_price_eur"] > 0 for r in rows)
          assert all(r["standard_50m2_price_to_pair_annual_net_years"] > 0 for r in rows)
          assert all(0 < r["rent_burden_pct_pair_net_income"] < 100 for r in rows)
          assert d.get("display_order")=="m2_per_year_after_rent_desc_for_visual_comparison_only"
          nav=Path("research-nav.js").read_text(encoding="utf-8")
          assert "housingAffordability:'housing'" in nav
          assert "label:'Būstas'" in nav
          app=Path("app.js").read_text(encoding="utf-8")
          assert "housing-affordability.js" in app
          view=Path("housing-affordability.js").read_text(encoding="utf-8")
          assert "Kiek poros metinių pajamų kainuoja 50 m² būstas?" in view
          assert "Pagrindinė išvada" in view
          assert "Mažesnis skaičius reiškia palankesnį kainos ir pajamų santykį." in view
          assert "Tai nėra bankinis paskolos įperkamumo vertinimas." in view
          assert "Tai nėra galutinis apskričių įperkamumo reitingas." in view
          assert "preliminary_affordability_rank" not in view
          assert "standard_50m2_price_to_pair_annual_net_years" in view
          assert "standard_50m2_price_eur" in view
          assert "rent_burden_pct_pair_net_income" in view
          assert 'class="housing-simple-table"' in view
          assert 'class="housing-details"' in view
          print("PASS: reader-first preliminary housing view, uncertainty labels and routing")
          PY
