name: Probe Aruodas hidden history payload

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "scripts/probe_aruodas_hidden_history.mjs"
      - ".github/workflows/aruodas-hidden-history-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aruodas-hidden-history-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe hidden historical payload
        run: |
          rm -rf research/raw/aruodas-hidden-history-probe
          node scripts/probe_aruodas_hidden_history.mjs
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/raw/aruodas-hidden-history-probe
          if git diff --cached --quiet; then
            echo "No probe changes"
          else
            git commit -m "Capture Aruodas hidden history probe [skip ci]"
            git fetch origin feature/housing-affordability
            git rebase origin/feature/housing-affordability
            git push origin HEAD:feature/housing-affordability
          fi
