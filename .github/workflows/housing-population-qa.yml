name: Housing population QA

on:
  push:
    branches:
      - audit/population-standard-2024-2025
    paths:
      - "app.js"
      - "research-nav.js"
      - "housing-affordability.js"
      - "data/housing-state-support-outcomes-2025.json"
      - "tests/test_housing_population_standard.py"
      - ".github/workflows/housing-population-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run population contract checks
        run: |
          python -m unittest -v tests/test_housing_population_standard.py
          node --check app.js
          node --check research-nav.js
          node --check housing-affordability.js
      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          python -m http.server 8765 > /tmp/housing-population-http.log 2>&1 &
          echo $! > /tmp/housing-population-http.pid
      - name: Check desktop and mobile housing view
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              for (const [name, viewport] of [
                ['desktop', {width:1440,height:900}],
                ['mobile', {width:390,height:844}]
              ]) {
                const page = await browser.newPage({viewport});
                const pageerrors = [];
                page.on('pageerror', e => pageerrors.push(e.message));
                await page.goto('http://127.0.0.1:8765/?view=housing', {waitUntil:'networkidle',timeout:60000});
                await page.waitForSelector('#housingAffordability', {state:'visible',timeout:30000});
                const result = await page.evaluate(() => {
                  const section = document.querySelector('#housingAffordability');
                  const text = section.innerText;
                  const canvas = section.querySelector('#housingSupportRecipientsChart');
                  return {
                    visible: !!section && getComputedStyle(section).display !== 'none',
                    has515: text.includes('515 jaunų šeimų') || text.includes('515'),
                    has556: text.includes('556'),
                    unknownDenominator: text.includes('Paramos aprėptis tarp visų jaunų šeimų'),
                    noOldHeadline: !text.includes('Ar jaunai dirbančiai porai'),
                    noIncomeGraph: !section.querySelector('#housingSupportIncomeChart'),
                    blockedCountyRanking: text.includes('Būsto kainų palyginimo dar nerodome'),
                    chartRendered: !!canvas && !!window.Chart && !!window.Chart.getChart(canvas),
                    overflow: document.documentElement.scrollWidth - window.innerWidth,
                    heading: section.querySelector('h2')?.innerText || ''
                  };
                });
                await page.locator('#housingAffordability').screenshot({path:'artifacts/housing-population-'+name+'.png',animations:'disabled'});
                console.log(name, JSON.stringify(result));
                if (pageerrors.length) throw Error(name+' runtime JS errors: '+pageerrors.join('; '));
                for (const field of ['visible','has515','has556','unknownDenominator','noOldHeadline','noIncomeGraph','blockedCountyRanking','chartRendered']) {
                  if (!result[field]) throw Error(name+' '+field+' FAIL');
                }
                if (result.overflow > 2) throw Error(name+' horizontal overflow='+result.overflow);
                await page.close();
              }
            } finally { await browser.close(); }
            console.log('PASS: housing population desktop/mobile browser QA');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: housing-population-visual-qa
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
