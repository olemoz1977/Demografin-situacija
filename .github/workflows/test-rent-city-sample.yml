name: Validate 2025 rent city sample

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "data/housing-rent-city-sample-2025.csv"
      - "data/housing-rent-city-sample-2025-summary.csv"
      - "scripts/summarize_housing_rent_city_sample.py"
      - "tests/test_summarize_housing_rent_city_sample.py"
      - ".github/workflows/test-rent-city-sample.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas

      - name: Run tests
        run: python -m unittest -v tests/test_summarize_housing_rent_city_sample.py

      - name: Rebuild city summary
        run: |
          python scripts/summarize_housing_rent_city_sample.py \
            --input data/housing-rent-city-sample-2025.csv \
            --out data/housing-rent-city-sample-2025-summary.csv

      - name: Commit refreshed city summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/housing-rent-city-sample-2025-summary.csv
          if git diff --cached --quiet; then
            echo "No city summary changes"
          else
            git commit -m "Refresh rent city sample summary [skip ci]"
            git fetch origin feature/housing-affordability
            git rebase origin/feature/housing-affordability
            git push origin HEAD:feature/housing-affordability
          fi
