name: Discover VDA rent ArcGIS source

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "scripts/discover_vda_rent_arcgis.mjs"
      - ".github/workflows/vda-rent-arcgis-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vda-rent-arcgis-feature
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover ArcGIS sources
        run: |
          rm -rf research/raw/vda-rent-arcgis
          node scripts/discover_vda_rent_arcgis.mjs

      - name: Commit discovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/raw/vda-rent-arcgis
          if git diff --cached --quiet; then
            echo "No discovery changes to commit"
          else
            git commit -m "Capture VDA rent ArcGIS discovery [skip ci]"
            git fetch origin feature/housing-affordability
            git rebase origin/feature/housing-affordability
            git push origin HEAD:feature/housing-affordability
          fi
