name: Smart Continent Power BI extraction

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - ".github/workflows/smart-continent-extract.yml"
      - "scripts/extract_smart_continent_powerbi.mjs"
      - "scripts/parse_smart_continent_powerbi_raw.mjs"
      - "scripts/extract_smart_continent_rent_proxy.mjs"

permissions:
  contents: write

concurrency:
  group: smart-continent-extract-feature
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Extract public Power BI report
        run: |
          rm -rf research/raw/smart-continent-powerbi/latest
          mkdir -p research/raw/smart-continent-powerbi/latest
          node scripts/extract_smart_continent_powerbi.mjs

      - name: Parse page 4 and run QA
        run: |
          node scripts/parse_smart_continent_powerbi_raw.mjs

      - name: Probe municipality rent-burden source fields
        run: |
          rm -rf research/raw/smart-continent-rent-proxy
          node scripts/extract_smart_continent_rent_proxy.mjs

      - name: Remove binary screenshots before commit
        run: |
          rm -f research/raw/smart-continent-powerbi/latest/*.png

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/raw/smart-continent-powerbi/latest \
            research/raw/smart-continent-rent-proxy \
            data/housing-sale-smart-continent-housing-2024-diagnostic.csv \
            research/smart-continent-housing-page4-qa-2024.json
          if git diff --cached --quiet; then
            echo "No extraction changes to commit"
          else
            git commit -m "Capture Smart Continent Power BI diagnostics [skip ci]"
            git fetch origin feature/housing-affordability
            git rebase origin/feature/housing-affordability
            git push origin HEAD:feature/housing-affordability
          fi
