name: Housing preview visual QA

on:
  push:
    branches:
      - feature/housing-affordability
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "app-base.js"
      - "research-nav.js"
      - "research-nav.css"
      - "housing-affordability.js"
      - "data/housing-affordability-preliminary-v01.json"
      - ".github/workflows/housing-preview-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housing-affordability
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          python -m http.server 8765 > /tmp/housing-preview-http.log 2>&1 &
          echo $! > /tmp/housing-preview-http.pid
      - name: Verify desktop and mobile render
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors = [];

            async function check(name, viewport, screenshot) {
              const page = await browser.newPage({ viewport });
              page.on('pageerror', err => errors.push(`${name}: pageerror: ${err.message}`));

              await page.goto('http://127.0.0.1:8765/?view=housing', {waitUntil:'networkidle'});
              await page.waitForSelector('#housingAffordability', {state:'visible'});
              await page.waitForSelector('#housingAffordability .housing-comparability-stop');

              const result = await page.evaluate(() => {
                const section = document.querySelector('#housingAffordability');
                const text = section.innerText;
                const rootOverflow = document.documentElement.scrollWidth - window.innerWidth;
                return {
                  hasStop: text.includes('50 m² nėra tas pats būstas.'),
                  hasDemographicFrame: text.includes('pirmas šeimos būstas') && text.includes('šeimos kūrimo aplinkos barjerų') && text.includes('neįrodinėja priežastinio ryšio su gimstamumu'),
                  hasStateSupport: !!section.querySelector('.housing-support-layer') && (section.querySelector('.housing-support-layer')?.textContent || '').includes('Valstybės pagalba pirmajam būstui'),
                  hasTwoSupportRoutes: section.querySelectorAll('.housing-support-card').length === 2,
                  hasBlockedConclusion: text.includes('nebelaikomi tinkamu tarpapskritiniu rezultatu'),
                  hasRequiredBasket: text.includes('45–55 m²') && text.includes('statybos laikotarpio / rinkos segmento taisyklė'),
                  hasOldChart: !!section.querySelector('#housingAffordabilityChart'),
                  hasOldSimpleTable: !!section.querySelector('.housing-simple-table'),
                  hasOldTechnicalTable: !!section.querySelector('.housing-table'),
                  hasOldNumbers: text.includes('3,66 m.') || text.includes('0,80 m.') || text.includes('54,8'),
                  rootOverflow,
                  sectionWidth: Math.round(section.getBoundingClientRect().width),
                  viewportWidth: window.innerWidth
                };
              });

              await page.locator('#housingAffordability').screenshot({path:screenshot});
              console.log(name, JSON.stringify(result));

              if (!result.hasStop) throw new Error(`${name}: comparability STOP missing`);
              if (!result.hasDemographicFrame) throw new Error(`${name}: first-family-home demographic framing missing`);
              if (!result.hasStateSupport) throw new Error(`${name}: official state-support layer missing`);
              if (!result.hasTwoSupportRoutes) throw new Error(`${name}: expected two state-support routes`);
              if (!result.hasBlockedConclusion) throw new Error(`${name}: blocked-result explanation missing`);
              if (!result.hasRequiredBasket) throw new Error(`${name}: comparable-basket requirement missing`);
              if (result.hasOldChart || result.hasOldSimpleTable || result.hasOldTechnicalTable) throw new Error(`${name}: old non-comparable visual remains`);
              if (result.hasOldNumbers) throw new Error(`${name}: old non-comparable result numbers remain`);
              if (result.rootOverflow > 2) throw new Error(`${name}: page horizontal overflow ${result.rootOverflow}px`);

              await page.close();
            }

            await check('desktop', {width:1440,height:1000}, 'artifacts/housing-desktop.png');
            await check('mobile', {width:390,height:844}, 'artifacts/housing-mobile.png');

            await browser.close();
            if (errors.length) throw new Error(errors.join('\n'));
            console.log('PASS: housing preview desktop/mobile visual QA');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: housing-preview-visual-qa
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
