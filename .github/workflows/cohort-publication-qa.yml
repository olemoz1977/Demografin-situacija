name: Cohort publication browser QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app-base.js'
      - 'scripts/analyze_cohort_balance.py'
      - 'research-nav.js'
      - 'tests/publication-visibility-qa.cjs'
      - '.github/workflows/cohort-publication-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Reproduce observed births decomposition
        run: |
          python scripts/validate_cohort_size.py
          python scripts/analyze_cohort_balance.py
      - name: Check all published findings, modules and mobile layout
        run: |
          python -m http.server 8765 >/tmp/cohort-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break
            sleep 1
          done
          node tests/publication-visibility-qa.cjs
      - name: Save decomposition screenshots for editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fertility-clarity-screenshots
          path: qa-screenshots/
